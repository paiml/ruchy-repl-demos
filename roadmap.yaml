quality_gates:
  mandatory:
    - gate: "demo_execution"
      command: "make test"
      threshold: 1.00
      description: "100% of demos must work"
      blocking: true

    - gate: "repl_verification"
      command: "make test-repl-integration"
      threshold: 1.00
      description: "All REPL demos must execute"
      blocking: true

    - gate: "notebook_verification"
      command: "make test-notebook"
      threshold: 1.00
      description: "All demos must work in notebook"
      blocking: true

    - gate: "comment_syntax"
      command: "make validate-comments"
      threshold: 1.00
      description: "All comments must use // syntax"
      blocking: true

    - gate: "satd_detection"
      command: "make analyze-satd-zero"
      threshold: 0
      description: "No technical debt comments allowed"
      blocking: true

    - gate: "quality_gates"
      command: "make quality-gates"
      threshold: 1.00
      description: "Toyota Way quality gates must pass"
      blocking: true

  advisory:
    - gate: "pmat_score"
      description: "PMAT TDG score"
      target: 90
      current: 87.6

    - gate: "dogfood_coverage"
      description: "% of demos tested with all 15 Ruchy tools"
      target: 1.00
      current: 0.80

