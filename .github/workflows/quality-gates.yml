# GitHub Actions Workflow - Quality Gates
# Implements Toyota Way principles with ZERO tolerance
# Based on validation framework from ruchy-repl-demos

name: Quality Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gates:
    name: Run Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Install Ruchy
      run: |
        cargo install ruchy --locked
        ruchy --version

    - name: Install ShellCheck
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck

    - name: Verify Project Structure
      run: |
        echo "Checking project structure..."
        test -d demos/repl || exit 1
        test -d demos/one-liners || exit 1
        test -d tests || exit 1
        test -d scripts || exit 1
        test -f README.md || exit 1
        test -f CLAUDE.md || exit 1
        test -f ROADMAP.md || exit 1
        echo "✅ Structure validated"

    - name: Install Dependencies
      run: make install

    - name: Run Ruchy Tests
      run: |
        echo "Running Ruchy native tests..."
        make test-ruchy-native

    - name: Check for SATD Comments (ZERO Tolerance)
      run: |
        echo "Checking for SATD comments..."
        SATD_COUNT=$(grep -r "TODO\|FIXME\|HACK\|XXX" demos/ tests/ 2>/dev/null | wc -l || echo "0")
        if [ "$SATD_COUNT" != "0" ]; then
          echo "❌ FAILED: Found $SATD_COUNT SATD comments"
          grep -rn "TODO\|FIXME\|HACK\|XXX" demos/ tests/ | head -10
          exit 1
        fi
        echo "✅ ZERO SATD comments"

    - name: Run ShellCheck
      run: |
        echo "Running ShellCheck on all scripts..."
        make shellcheck

    - name: Validate Comment Syntax
      run: |
        echo "Validating comment syntax..."
        ./scripts/validate_comment_syntax.sh

    - name: Run MANDATORY Quality Gates
      run: |
        echo "Running MANDATORY quality gates..."
        make quality-gates

    - name: Run Coverage Report
      run: |
        echo "Generating coverage report..."
        make coverage-report

    - name: Check Test Coverage
      run: |
        echo "Checking test coverage..."
        DEMO_COUNT=$(find demos -name '*.repl' -o -name '*.sh' | wc -l)
        if [ "$DEMO_COUNT" -lt 50 ]; then
          echo "❌ FAILED: Only $DEMO_COUNT demos (minimum: 50)"
          exit 1
        fi
        echo "✅ Demo count: $DEMO_COUNT"

    - name: Update Integration Report
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        echo "Updating INTEGRATION.md..."
        make update-integration

    - name: Upload Coverage Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          INTEGRATION.md
          test-results.json
        retention-days: 30

    - name: Comment PR with Results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let report = '## Quality Gates Report\n\n';
          try {
            const integration = fs.readFileSync('INTEGRATION.md', 'utf8');
            report += '### Status\n';
            report += '✅ All quality gates passed!\n\n';
            report += '### Demo Count\n';
            const demoMatch = integration.match(/Total demos:\s+(\d+)/);
            if (demoMatch) {
              report += `Total: ${demoMatch[1]} demos\n\n`;
            }
            report += '### Test Results\n';
            const testMatch = integration.match(/Pass Rate:\s+([\d.]+%)/);
            if (testMatch) {
              report += `Pass Rate: ${testMatch[1]}\n\n`;
            }
            report += '### Quality Score\n';
            report += 'See detailed report in artifacts.\n';
          } catch (e) {
            report += '⚠️ Could not generate detailed report\n';
          }

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: report
          });

  strict-quality-gates:
    name: Strict Quality Gates (ZERO Tolerance)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality-gates

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Install Ruchy
      run: cargo install ruchy --locked

    - name: Install ShellCheck
      run: sudo apt-get install -y shellcheck

    - name: Run Strict Quality Gates
      run: |
        echo "Running STRICT quality gates (ZERO tolerance)..."
        make quality-gate-strict

    - name: Run Kaizen
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        echo "Running Kaizen continuous improvement cycle..."
        make kaizen

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [quality-gates, strict-quality-gates]
    if: always()

    steps:
    - name: Report Status
      run: |
        if [ "${{ needs.quality-gates.result }}" == "success" ] && [ "${{ needs.strict-quality-gates.result }}" == "success" ]; then
          echo "✅ ALL QUALITY GATES PASSED"
          echo "Toyota Way: Quality built-in, not bolted-on"
        else
          echo "❌ QUALITY GATES FAILED"
          echo "Never allow defects to pass downstream!"
          exit 1
        fi
