# Quality Gate Configuration for Ruchy REPL & One-Liner Demos
# Generated by: Sprint 8 - PMAT Integration
# Last Updated: November 4, 2025

[meta]
project = "Ruchy REPL & One-Liner Demos"
approach = "Extreme Test-Driven Development (TDD)"
target_version = "v3.63.0"

[gates]
# MANDATORY QUALITY GATES (from CLAUDE.md)

# 1. Comment Syntax Validation
run_comment_validation = true
comment_syntax = "//"  # Ruchy uses // not #
validate_command = "make validate-comments"

# 2. Syntax Validation
run_syntax_check = true
syntax_check_command = "ruchy check"
fail_on_syntax_error = true

# 3. Test Coverage
check_coverage = true
min_coverage = 80.0  # 80% minimum per CLAUDE.md
coverage_command = "ruchy test --coverage"

# 4. Lint Compliance
run_lint = true
lint_command = "ruchy lint"
lint_strict = true  # Zero warnings

# 5. Code Formatting
run_format_check = true
format_command = "ruchy fmt --check"
auto_format = false  # Manual formatting required

# 6. Execution Test
run_execution_tests = true
execution_timeout = 100  # milliseconds per demo (CLAUDE.md limit)
fail_on_execution_error = true

# 7. Performance Check
check_performance = true
max_execution_time_ms = 100  # < 100ms per CLAUDE.md
performance_command = "ruchy runtime"

# 8. Complexity Analysis
check_complexity = true
max_cyclomatic_complexity = 10  # Per function limit
max_cognitive_complexity = 7    # PMAT standard
max_nesting_depth = 3          # CLAUDE.md limit
complexity_command = "ruchy runtime --complexity"

# 9. Quality Score
check_quality_score = true
min_quality_score = 0.8  # 80% minimum per CLAUDE.md
quality_command = "ruchy score"

# 10. ShellCheck Compliance (for shell scripts)
run_shellcheck = true
shellcheck_shell = "sh"  # POSIX sh only
shellcheck_strict = true
shellcheck_excludes = ["SC2039", "SC3043"]

[performance]
# Performance Standards (CLAUDE.md)
repl_startup_ms = 50   # ≤ 50ms
demo_execution_ms = 100  # ≤ 100ms
memory_usage_mb = 50   # ≤ 50MB
output_size_kb = 10    # ≤ 10KB

[complexity_limits]
# Complexity Limits (CLAUDE.md)
cognitive_complexity = 10
line_count_repl = 20
line_count_oneliner = 1
nesting_depth = 3
function_parameters = 3

[validation]
# TDD Requirements (CLAUDE.md)
tdd_required = true
test_before_doc = true  # Tests must exist before documentation
zero_untested_examples = true

# Version Compatibility
require_version_tags = true
target_ruchy_version = "3.63.0"

# Comment Syntax Enforcement
enforce_comment_syntax = true
ruchy_comment_style = "//"
bash_comment_style = "#"
markdown_heading_style = "#"

[satd]
# Self-Admitted Technical Debt
satd_tolerance = 0  # Zero tolerance for TODO/FIXME/HACK in production
satd_patterns = ["TODO", "FIXME", "HACK", "XXX", "TEMP"]

[shell_standards]
# Shell Script Standards (CLAUDE.md)
posix_compliant = true
shell_executable = "/bin/sh"
shell_flags = "-eu"  # Exit on error, undefined variables are errors
no_bashisms = true

forbidden_patterns = [
    "echo -e",      # Use printf
    "source",       # Use .
    "[[",           # Use [
    "==",           # Use = for string comparison
    "&>",           # Use > file 2>&1
    "<<<",          # No here-strings
    "${var^^}",     # No parameter expansion
]

[demo_standards]
# Demo Standards (CLAUDE.md)

[demo_standards.repl]
max_lines = 20
max_execution_ms = 100
require_objective_comment = true
require_expected_output = true

[demo_standards.oneliner]
max_lines = 1
max_length_chars = 200
require_description = true
require_example_output = true

[categories]
# Required Demo Categories (CLAUDE.md)

[categories.repl]
basics = 10         # Minimum demos required
functions = 10
data_structures = 10
algorithms = 5
functional = 10
advanced = 5

[categories.oneliner]
text_processing = 20
data_analysis = 15
file_operations = 10
math_calculations = 20
system_scripting = 15
functional_chains = 20

[version_management]
# Version Compatibility (CLAUDE.md)
minimum_ruchy = "1.30.1"
recommended_ruchy = "3.63.0"
tested_versions = ["1.30.0", "1.30.1", "3.63.0"]
current_target = "3.63.0"

[integration]
# Integration Testing
ruchy_compatibility_test = true
platform_compatibility = ["linux", "macos", "windows"]
shell_compatibility = "/bin/sh"

[ci_cd]
# Continuous Integration
run_on_commit = true
pre_commit_hook = ".git-hooks/pre-commit"
quality_gate_blocking = true  # Commits blocked if gates fail

[release]
# Release Requirements (CLAUDE.md)
all_tests_passing = true
documentation_complete = true
examples_verified = true
performance_benchmarks_met = true
no_todo_fixme = true
version_bumped = true
changelog_updated = true
readme_examples_working = true

[extreme_toyota_way]
# EXTREME TOYOTA WAY: STOP THE LINE
stop_the_line_enabled = true
jidoka_enabled = true  # Automated quality verification
defect_response_protocol = "STOP-ANALYZE-FIX-TEST-PREVENT-DOCUMENT"
zero_defects_tolerance = true
